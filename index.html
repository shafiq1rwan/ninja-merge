<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#15110d" />
    <meta name="description" content="Ninja Merge RPG - merge ninjas 2048-style to battle monsters, level up and conquer the world map." />
    <title>Ninja Merge RPG</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23c0392b'/%3E%3Crect x='3' y='6' width='10' height='4' fill='%23f5e6c8'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="game-container" aria-label="Ninja Merge RPG game canvas">
      <noscript>Ninja Merge RPG needs JavaScript enabled to run.</noscript>
    </div>

    <!-- DOM overlay used only for importing save data (native textarea = reliable paste on mobile). -->
    <div id="import-overlay" hidden>
      <div class="import-panel" role="dialog" aria-modal="true" aria-labelledby="import-title">
        <h2 id="import-title">Import Save</h2>
        <p>Paste the exported save JSON below.</p>
        <textarea id="import-text" rows="8" spellcheck="false" aria-label="Save data"></textarea>
        <div class="import-actions">
          <button type="button" id="import-cancel">Cancel</button>
          <button type="button" id="import-confirm" class="primary">Import</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
